services:
  ollama:
    image: ollama/ollama:latest      # CPU only: no GPU settings on purpose
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
 
  triage:
    build: ./service
    ports:
      - "8000:8000"
    environment:
      MODEL: ${MODEL:-llama3.2:1b}   # override: set MODEL before docker compose up -d
    volumes:
      - triage_data:/data
      - ./results/logs:/app/logs
    depends_on:
      - ollama
 
volumes:
  ollama_models:
  triage_data: